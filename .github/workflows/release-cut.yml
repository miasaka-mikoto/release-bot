name: sandcastle · release cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.68.0'
        required: true
      dry_run:
        description: '只做 dry-run：构建 + 预览 notes，不切分支不发版'
        type: boolean
        default: true
      base_ref:
        description: '切分的基线分支'
        default: 'main'

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dry-run 构建
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.build?0:1)" 2>/dev/null; then
            npm ci --ignore-scripts || npm install --ignore-scripts
            npm run build
          else
            echo "仓库无 build 脚本，dry-run 构建通过（占位）"

      - name: 生成 release notes（预览）
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then RANGE="HEAD"; else RANGE="$PREV_TAG..HEAD"; fi
          echo "区间：$RANGE"
          node scripts/release-notes.mjs --from "$RANGE" --format markdown | tee /tmp/notes.md
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run 结束
        if: ${{ inputs.dry_run }}
        run: echo "Dry-run 完成，未切分支。确认无误后以 dry_run=false 重跑正式切分。"

      - name: 切发布分支
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "sandcastle[bot]"
          git config user.email "sandcastle[bot]@users.noreply.github.com"
          git checkout -b "releases/${{ inputs.version }}"
          git push -u origin "releases/${{ inputs.version }}"

      - name: 通知贡献者
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then RANGE="HEAD"; else RANGE="$PREV_TAG..HEAD"; fi
          node scripts/notify-authors.mjs --from "$RANGE" --version "${{ inputs.version }}" --post-issue

  verify:
    needs: cut
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: releases/${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 冒烟测试
        id: smoke
        continue-on-error: true
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: node scripts/smoke.mjs

      - name: 冒烟通过
        if: steps.smoke.outcome == 'success'
        run: echo "✅ ${{ inputs.version }} 冒烟通过，可以发版"

      - name: 失败 → 建 bot-fix issue（poteto 接手）
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=/tmp/smoke-report.md
          [ -f "$BODY_FILE" ] || echo "冒烟测试失败（无详细报告）。版本：${{ inputs.version }}，分支：releases/${{ inputs.version }}" > "$BODY_FILE"
          gh issue create \
            --title "🐛 [bot-fix] ${{ inputs.version }} 冒烟失败" \
            --label "bot-fix" \
            --body-file "$BODY_FILE"
